baseURL = 'https://chartedroots.com/'
languageCode = 'en-us'
title = 'Charted Roots'
theme = 'blowfish'

# Enable emoji rendering
enableEmoji = true

# Build settings
[build]
  noJSConfigInAssets = true

# HTML minifier — preserve attribute quotes so strict third-party
# validators (Bing Webmaster Tools, etc.) can parse our meta tags.
[minify.tdewolff.html]
  keepQuotes = true

# Google Analytics — Blowfish renders the gtag snippet from this ID,
# gated to production builds (hugo.IsProduction) so local dev never fires.
[services.googleAnalytics]
  ID = "G-1567EEBYHM"

[params]
  # Site description — shown as the hero tagline and meta description
  description = "Obsidian plugin for genealogy and worldbuilding: family tree visualization, evidence tracking, fictional universes, and reports."

  # Site appearance
  colorScheme = "charted-roots"
  defaultAppearance = "light"
  autoSwitchAppearance = false

  # Homepage
  homepage.layout = "custom"
  homepage.showRecent = false

  # Temporary BRAT → Community Plugins migration banner on the homepage.
  # Flip to false (or delete) at ~2026-05-29 to remove. See
  # layouts/partials/home/custom.html + assets/css/custom.css for the markup
  # and styles; static/js/cr-migration-banner.js handles the dismiss action.
  showMigrationBanner = true

  # Social / OG
  defaultSocialImage = "img/social-card.png"

  # Search engine verification
  verification.bing = "15A5E97E3BFB0A25CC0ABBA0696C34E0"

  # Article settings
  article.showAuthor = false
  article.showDate = true
  article.showReadingTime = true
  article.showTableOfContents = true
  article.showPagination = true
  article.showBreadcrumbs = true

  # List settings
  list.showBreadcrumbs = true
  list.showTableOfContents = true

  # Global settings
  enableSearch = true
  enableCodeCopy = true

  # Brand area: render the logo only, not the duplicated site title text
  disableTextInHeader = true

  # Logo and branding
  logo = "img/logo.svg"

  # Footer
  footer.showCopyright = true
  footer.showThemeAttribution = false
  footer.showAppearanceSwitcher = false
  footer.showScrollToTop = true

[params.author]
  name = "banisterious"

# Main menu
[menu]
  [[menu.main]]
    name = "Features"
    pageRef = "features"
    weight = 10
  [[menu.main]]
    name = "Research"
    pageRef = "research"
    weight = 15
  [[menu.main]]
    name = "Worldbuilding"
    pageRef = "worldbuilding"
    weight = 20
  # Docs dropdown — parent has no URL so click toggles the menu
  [[menu.main]]
    identifier = "docs"
    name = "Docs"
    weight = 25
  [[menu.main]]
    parent = "docs"
    name = "Guides"
    pageRef = "guides"
    weight = 1
  [[menu.main]]
    parent = "docs"
    name = "Documentation"
    url = "https://github.com/banisterious/obsidian-charted-roots/wiki"
    weight = 2
  [[menu.main]]
    parent = "docs"
    name = "FAQ"
    pageRef = "faq"
    weight = 3
  [[menu.main]]
    parent = "docs"
    name = "Changelog"
    pageRef = "changelog"
    weight = 4
  [[menu.main]]
    identifier = "obsidian"
    pre = "obsidian"
    title = "Install from Obsidian Community"
    url = "https://community.obsidian.md/plugins/charted-roots"
    weight = 35
  [[menu.main]]
    pre = "github"
    title = "View source on GitHub"
    url = "https://github.com/banisterious/obsidian-charted-roots"
    weight = 40

# Markup settings
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

# Output formats for search
[outputs]
  home = ["HTML", "RSS", "JSON"]
